<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Belajar Python Visual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<style>
  :root {
    --bg: #05070a;
    --panel: #0b1a24;
    --panel-2: #0e2233;
    --border: #1f4a5c;
    --text: #d7e3ea;
    --muted: #7b93a3;
    --yellow: #f5d547;
    --green: #22c55e;
    --green-soft: #14532d;
    --red: #b91c1c;
    --red-soft: #4c1414;
    --cyan: #5eead4;
    --blue: #60a5fa;
    --kw: #c792ea;
    --str: #c3e88d;
    --num: #f78c6c;
    --fn: #82aaff;
    --line-hl: rgba(245, 213, 71, .14);
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--mono); font-size: 14px; line-height: 1.5; font-variant-ligatures: none;
  }
  button, input, select, textarea { font: inherit; }
  code { color: var(--str); }
  [hidden] { display: none !important; }

  header {
    display: flex; align-items: center; gap: 12px 18px; flex-wrap: wrap;
    padding: 12px 20px; border-bottom: 1px solid #12232e;
  }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; color: var(--yellow); font-size: 18px; }
  .logo svg { width: 26px; height: 26px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .version {
    margin-left: auto; align-self: flex-start; color: var(--muted); font-size: 12px; font-weight: 600;
    border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px;
  }
  .tabs button {
    background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 999px;
    padding: 5px 14px; cursor: pointer;
  }
  .tabs button.active { background: var(--yellow); border-color: var(--yellow); color: #1a1600; font-weight: 800; }

  .layout { display: grid; grid-template-columns: 240px 1fr; min-height: calc(100vh - 60px); }
  nav { border-right: 1px solid #12232e; padding: 16px 12px; }
  nav h3 { font-size: 11px; color: var(--muted); letter-spacing: .1em; margin: 0 8px 10px; }
  nav button {
    display: block; width: 100%; text-align: left; background: none; border: 1px solid transparent;
    color: var(--text); padding: 9px 10px; border-radius: 8px; cursor: pointer; margin-bottom: 4px;
  }
  nav button small { display: block; color: var(--muted); font-size: 11px; }
  nav button:hover { background: #0b151c; }
  nav button.active { background: var(--panel); border-color: var(--border); }
  nav button.active span { color: var(--yellow); }
  nav .done-mark { float: right; color: var(--green); }

  main { padding: 20px; max-width: 1200px; width: 100%; }
  .title { text-align: center; margin-bottom: 18px; }
  .title .py { color: var(--yellow); font-weight: 800; font-size: 13px; letter-spacing: .08em; }
  .title h1 { margin: 2px 0 0; font-size: 20px; color: var(--yellow); letter-spacing: .04em; }

  .grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 18px; align-items: start; }
  .grid.ed { grid-template-columns: 1.15fr 1fr; }
  .col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

  /* Stage: kotak variabel */
  .stage {
    min-height: 170px; display: flex; flex-wrap: wrap; justify-content: center; align-content: flex-start;
    gap: 14px 16px; padding: 10px 6px 0;
  }
  .empty-stage { color: var(--muted); align-self: center; text-align: center; padding-top: 50px; }
  .grp { flex-basis: 100%; text-align: center; color: var(--kw); font-size: 12px; border-top: 1px dashed var(--border); padding-top: 6px; }
  .var { display: flex; flex-direction: column; align-items: center; animation: pop .25s ease; }
  .var .name { color: var(--cyan); font-size: 12px; margin-bottom: 4px; }
  .cells { position: relative; display: flex; border: 2px solid var(--cyan); border-radius: 6px; }
  .cell {
    width: var(--cw, 26px); height: 34px; display: grid; place-items: center;
    font-weight: 800; font-size: 16px; color: #fff; transition: background .2s; white-space: pre;
  }
  .cells.str .cell { --cw: 26px; }
  .cells.list .cell { --cw: 42px; border-right: 1px solid #1f4a5c; }
  .cells.list.auto .cell { width: auto; min-width: 42px; padding: 0 7px; font-size: 14px; }
  .cells.list .cell:last-child { border-right: none; }
  .cells.empty { min-width: 46px; height: 38px; display: grid; place-items: center; color: var(--muted); }
  .cell.hit { background: var(--green); color: #04130a; }
  .cell.miss { background: var(--red); }
  .cells.mark-miss { background: var(--red-soft); border-color: var(--red); }
  .cells.mark-miss .cell { color: #fca5a5; }
  .cells.mark-hit { background: var(--green-soft); border-color: var(--green); }
  .box {
    min-width: 46px; height: 38px; padding: 0 12px; display: grid; place-items: center; max-width: 100%;
    border: 2px solid var(--cyan); border-radius: 6px; font-weight: 800; font-size: 16px; color: #fff; white-space: pre;
    overflow: hidden; text-overflow: ellipsis;
  }
  .box.small { font-size: 13px; font-weight: 600; }
  .box.fn { border-color: var(--kw); color: var(--kw); font-size: 13px; }
  .box.bool-true { border-color: var(--green); color: var(--green); }
  .box.bool-false { border-color: var(--red); color: #fca5a5; }
  .changed .box, .changed .cells { animation: flash .6s ease; }
  .ptr-row { position: relative; height: 66px; width: 100%; }
  .ptr {
    position: absolute; top: 2px; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; transition: left .3s ease;
  }
  .ptr .arrow { color: var(--green); font-size: 16px; line-height: 1; font-weight: 800; }
  .ptr .pname { color: #fff; font-size: 11px; font-weight: 600; }
  .ptr .pval {
    min-width: 26px; height: 26px; padding: 0 5px; display: grid; place-items: center;
    border: 2px solid var(--cyan); border-radius: 5px; color: #fff; font-weight: 800; background: var(--bg);
  }
  .ptr.alt .arrow { color: var(--blue); }
  .ptr.alt .pval { border-color: var(--blue); }
  @keyframes pop { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
  @keyframes flash { 0% { box-shadow: 0 0 0 0 rgba(245,213,71,.9); } 100% { box-shadow: 0 0 0 10px rgba(245,213,71,0); } }

  /* Output */
  .label {
    display: inline-block; background: #1d2b12; color: var(--yellow); font-weight: 800;
    font-size: 11px; padding: 1px 6px; border-radius: 3px 3px 0 0; letter-spacing: .05em;
  }
  .output {
    background: var(--panel); border: 1px solid var(--border); border-radius: 0 6px 6px 6px;
    min-height: 92px; max-height: 320px; overflow: auto; padding: 10px 14px; white-space: pre-wrap; word-break: break-word;
  }
  .output .in { color: var(--blue); }
  .output .err { color: #f87171; }
  .output .enter {
    display: inline-block; margin-left: 10px; padding: 0 8px; border: 1px solid var(--green); border-radius: 4px;
    color: var(--green); font-size: 12px; line-height: 16px;
  }
  .cursor { display: inline-block; width: 8px; height: 15px; background: var(--text); vertical-align: -2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* Code (materi) */
  .editor { background: #0a2236; border: 1px solid #23506c; border-radius: 10px; overflow: hidden; }
  .dots { display: flex; gap: 7px; padding: 12px 14px; align-items: center; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .dots i:nth-child(1) { background: #ff5f57; } .dots i:nth-child(2) { background: #febc2e; } .dots i:nth-child(3) { background: #28c840; }
  .dots .fname { margin-left: 8px; color: var(--muted); font-size: 12px; }
  .code { padding: 6px 0 14px; overflow-x: auto; }
  .ln { display: flex; padding: 1px 14px 1px 0; border-left: 3px solid transparent; white-space: pre; min-height: 22px; transition: background .2s; }
  .ln .no { width: 34px; text-align: right; padding-right: 12px; color: #5b7a8e; user-select: none; flex: none; }
  .ln.active { background: var(--line-hl); border-left-color: var(--yellow); }
  .ln.active .no { color: var(--yellow); }
  .tk-kw { color: var(--kw); } .tk-str { color: var(--str); } .tk-num { color: var(--num); }
  .tk-fn { color: var(--fn); } .tk-com { color: #5b7a8e; font-style: italic; }

  /* Editor kode (CodeMirror) */
  .CodeMirror { background: #0a2236; color: var(--text); height: 360px; font-family: var(--mono); font-size: 14px; line-height: 1.55; font-variant-ligatures: none; }
  * { scrollbar-width: thin; scrollbar-color: #1f4a5c transparent; }
  .CodeMirror-gutters { background: #0a2236; border-right: 1px solid #1f4a5c; }
  .CodeMirror-linenumber { color: #5b7a8e; }
  .CodeMirror-cursor { border-left: 2px solid var(--yellow); }
  .CodeMirror-selected, .CodeMirror-focused .CodeMirror-selected { background: #24577a !important; }
  .CodeMirror-matchingbracket { color: var(--yellow) !important; }
  .cm-s-default .cm-keyword { color: var(--kw); } .cm-s-default .cm-string { color: var(--str); }
  .cm-s-default .cm-number { color: var(--num); } .cm-s-default .cm-builtin { color: var(--fn); }
  .cm-s-default .cm-comment { color: #5b7a8e; font-style: italic; } .cm-s-default .cm-def { color: var(--fn); }
  .cm-s-default .cm-variable, .cm-s-default .cm-variable-2, .cm-s-default .cm-property { color: var(--text); }
  .cm-s-default .cm-operator { color: var(--cyan); } .cm-s-default .cm-atom { color: var(--num); }
  .cm-step { background: var(--line-hl); box-shadow: inset 3px 0 var(--yellow); }
  .cm-err { background: rgba(185, 28, 28, .35); box-shadow: inset 3px 0 #f87171; }
  textarea.plain-editor { width: 100%; height: 360px; background: #0a2236; color: var(--text); border: 0; padding: 10px 14px; font-family: var(--mono); resize: vertical; }

  /* Controls */
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 12px; cursor: pointer;
  }
  .btn:hover { border-color: var(--cyan); }
  .btn.primary { background: var(--yellow); color: #1a1600; border-color: var(--yellow); font-weight: 800; }
  .btn.go { background: var(--green); color: #04130a; border-color: var(--green); font-weight: 800; }
  .btn:disabled { opacity: .4; cursor: default; }
  select.btn { padding: 7px 8px; }
  .progress { flex: 1 1 140px; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
  .bar { flex: 1; height: 6px; background: #12232e; border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--yellow); width: 0; transition: width .2s; }
  .status { color: var(--muted); font-size: 12px; }
  .status.ok { color: var(--green); }
  .status.bad { color: #f87171; }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .card h4 { margin: 0 0 6px; font-size: 12px; color: var(--yellow); letter-spacing: .06em; }
  .note { min-height: 44px; }
  .note b { color: var(--yellow); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { border: 1px solid var(--border); color: var(--cyan); border-radius: 999px; padding: 1px 9px; font-size: 12px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .field {
    flex: 1 1 160px; background: #061018; color: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px;
  }
  textarea.field { width: 100%; resize: vertical; }
  .field:focus { outline: none; border-color: var(--cyan); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .fb { margin-top: 8px; font-weight: 600; }
  .fb.ok { color: var(--green); } .fb.no { color: #f87171; }

  .task { margin-bottom: 16px; border-color: #3b4d1e; }
  .tests { display: flex; flex-direction: column; gap: 4px; margin: 10px 0; font-size: 13px; }
  .tests div { background: #061018; border-radius: 6px; padding: 4px 10px; color: var(--muted); }
  .tests div b { color: var(--text); font-weight: 600; }
  .tests div.pass { color: var(--green); } .tests div.fail { color: #f87171; }
  .task-extra { margin-top: 8px; padding: 8px 10px; background: #061018; border-radius: 6px; white-space: pre-wrap; }

  @media (max-width: 1150px) {
    .grid, .grid.ed { grid-template-columns: 1fr; }
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    nav { border-right: none; border-bottom: 1px solid #12232e; display: flex; overflow-x: auto; gap: 6px; padding: 10px 16px; }
    nav h3 { display: none; }
    nav button { flex: none; width: auto; margin: 0; }
    nav button small { display: none; }
    main { padding: 16px; }
    .CodeMirror, textarea.plain-editor { height: 300px; }
  }
</style>
</head>

    PYTHON
  </div>
  <div class="tabs" id="tabs">
    <button data-mode="materi">📘 Materi Visual</button>
    <button data-mode="editor">💻 Editor Kode</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script>
// ---------- Tracer: merekam snapshot keadaan program per langkah (materi) ----------
function Tracer() {
  const vars = [], out = [], steps = [];
  const find = name => vars.find(v => v.name === name);
  return {
    steps,
    set(name, kind, value) {
      let v = find(name);
      if (!v) { v = { name }; vars.push(v); }
      Object.assign(v, { kind, value, changed: true });
    },
    mark(name, props) { Object.assign(find(name), props); },
    prompt(text) { out.push({ text, typing: true }); },
    typed(value) { const o = out[out.length - 1]; o.typing = false; o.input = value; o.enter = true; },
    print(text) { out.forEach(o => o.enter = false); out.push({ text }); },
    snap(line, note) {
      steps.push(JSON.parse(JSON.stringify({ line, note, vars, out })));
      vars.forEach(v => { delete v.changed; delete v.ptrs; delete v.hl; delete v.mark; });
    },
  };
}

const pyStr = s => `"${s}"`;

// ---------- Materi ----------
const LESSONS = [
  {
    title: 'COUNT VOWELS IN A WORD', menu: 'Hitung Huruf Vokal', sub: 'sum() + generator',
    input: 'ORANGE', hint: 'Masukkan sebuah kata, misalnya ORANGE atau Indonesia.',
    code: [
      'text = input("Enter text: ")',
      '',
      'vowels = "aeiou"',
      'count = sum(char.lower() in vowels for char in text)',
      '',
      'print("Vowels:", count)',
    ],
    concept: 'Ekspresi <b>char.lower() in vowels</b> menghasilkan True/False. Di Python True bernilai 1 dan False bernilai 0, jadi <b>sum()</b> dari semua hasil itu sama dengan jumlah huruf vokal.',
    chips: ['input()', 'str.lower()', 'operator in', 'generator expression', 'sum()'],
    quiz: { q: 'Jika pengguna mengetik <b>Python</b>, apa output-nya?', a: 'Vowels: 1' },
    trace(inp, T) {
      T.prompt('Enter text: ');
      T.snap(1, 'Fungsi <b>input()</b> menampilkan teks "Enter text: " dan menunggu pengguna mengetik.');
      T.typed(inp); T.set('text', 'str', inp);
      T.snap(1, `Pengguna mengetik <b>${esc(inp)}</b> lalu menekan Enter. Nilainya disimpan ke variabel <b>text</b>.`);
      T.set('vowels', 'str', 'aeiou');
      T.snap(3, 'Variabel <b>vowels</b> berisi semua huruf vokal sebagai acuan.');
      let count = 0;
      T.set('count', 'num', 0);
      T.snap(4, '<b>sum()</b> mulai dari 0. Generator akan memeriksa setiap <b>char</b> di dalam text satu per satu.');
      [...inp].forEach((c, i) => {
        const lc = c.toLowerCase(), k = 'aeiou'.indexOf(lc);
        T.mark('text', { ptrs: [{ i, name: 'char', val: c }] });
        if (k >= 0) {
          count++;
          T.mark('vowels', { hl: [{ i: k, st: 'hit' }], mark: 'hit' });
          T.set('count', 'num', count);
          T.snap(4, `char = "${esc(c)}" → "${esc(lc)}" <b>ada</b> di vowels ✔ → True (1). count menjadi <b>${count}</b>.`);
        } else {

// ---------- Utilitas ----------
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const TOKEN = /(#.*$)|(f?"[^"]*"|'[^']*')|\b(for|in|if|elif|else|while|break|return|def|True|False|None|and|or|not)\b|\b(print|input|sum|len|int|range|str|list)\b|\b(\d+)\b/g;
const highlight = line => esc(line).replace(TOKEN, (m, com, str, kw, fn, num) =>
  com ? `<span class="tk-com">${m}</span>` : str ? `<span class="tk-str">${m}</span>` :
  kw ? `<span class="tk-kw">${m}</span>` : fn ? `<span class="tk-fn">${m}</span>` : `<span class="tk-num">${m}</span>`);
const store = {
  get(k, d) { try { const v = localStorage.getItem('bpv:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('bpv:' + k, JSON.stringify(v)); } catch {} },
};

// ---------- Tampilan variabel & output ----------
function renderVar(v) {
  const wrap = document.createElement('div');
  wrap.className = 'var' + (v.changed ? ' changed' : '');
  let body;
  if (v.kind === 'str' || v.kind === 'list') {
    const items = v.kind === 'str' ? [...v.value] : v.value;
    if (!items.length) body = `<div class="cells empty">${v.kind === 'str' ? '""' : '[ ]'}</div>`;
    else {
      const hl = {}; (v.hl || []).forEach(h => hl[h.i] = h.st);
      const cw = v.kind === 'str' ? 26 : 42;
      const cells = items.map((c, i) => `<div class="cell ${hl[i] || ''}">${esc(c)}</div>`).join('');
      const ptrs = (v.ptrs || []).map(p =>
        `<div class="ptr ${p.alt ? 'alt' : ''}" style="left:${p.i * cw + cw / 2}px"><span class="arrow">↑</span><span class="pname">${esc(p.name)}</span><span class="pval">${esc(p.val)}</span></div>`).join('');
      body = `<div class="cells ${v.kind} ${v.auto ? 'auto' : ''} ${v.mark ? 'mark-' + v.mark : ''}">${cells}</div>` +
        (v.ptrs ? `<div class="ptr-row" style="width:${items.length * cw}px">${ptrs}</div>` : '');
    }
  } else if (v.kind === 'bool') {
    body = `<div class="box bool-${v.value}">${v.value ? 'True' : 'False'}</div>`;
  } else if (v.kind === 'fn') {
    body = `<div class="box fn">${esc(v.value)}</div>`;
  } else {
    body = `<div class="box ${String(v.value).length > 12 ? 'small' : ''}">${esc(v.value)}</div>`;
  }
  wrap.innerHTML = `<div class="name">${esc(v.name)}</div>${body}`;
  return wrap;
}

const outHtml = out => out.map(o =>
  esc(o.text) + (o.input !== undefined ? `<span class="in">${esc(o.input)}</span>` : '') +
  (o.enter ? '<span class="enter">↵</span>' : '') + (o.typing ? '<span class="cursor"></span>' : '')).join('\n');
const segsHtml = segs => segs.map(([k, t]) =>
  k === 'i' ? `<span class="in">${esc(t)}</span>` : k === 'e' ? `<span class="err">${esc(t)}</span>` : esc(t)).join('');

const controlsHtml = p => `<div class="controls">
  <button class="btn" id="${p}reset" title="Ulang (R)">⏮</button>
  <button class="btn" id="${p}prev" title="Mundur (←)">◀</button>
  <button class="btn primary" id="${p}play" title="Putar / jeda (Spasi)">▶ Putar</button>
  <button class="btn" id="${p}next" title="Maju (→)">▶|</button>
  <select class="btn" id="${p}speed" title="Kecepatan">
    <option value="1600">0.5×</option><option value="900" selected>1×</option><option value="450">2×</option>
  </select>
  <div class="progress"><div class="bar"><i id="${p}bar"></i></div><span id="${p}info"></span></div>
</div>`;

// Pemutar langkah: dipakai oleh Materi (L) dan Editor (E)
function Player(p, onLine) {
  $(p + 'ctl').innerHTML = controlsHtml(p);
  const el = id => $(p + id);
  let steps = [], idx = 0, timer = null;

  function draw() {
    const s = steps[idx];
    const stage = el('stage');
    stage.innerHTML = '';
    let grp;
    s.vars.forEach(v => {
      if (v.group !== grp && v.group) {
        const h = document.createElement('div');
        h.className = 'grp'; h.textContent = 'variabel lokal di ' + v.group;
        stage.appendChild(h);
      }
      grp = v.group;
      stage.appendChild(renderVar(v));
    });
    if (!s.vars.length) stage.innerHTML = '<div class="empty-stage">Belum ada variabel.</div>';
    el('output').innerHTML = s.segs ? segsHtml(s.segs) : outHtml(s.out);
    el('output').scrollTop = el('output').scrollHeight;
    el('note').innerHTML = s.note;
    el('info').textContent = `${idx + 1}/${steps.length}`;
    el('bar').style.width = `${(idx + 1) / steps.length * 100}%`;
    el('prev').disabled = idx === 0;
    el('next').disabled = idx === steps.length - 1;
    el('play').disabled = steps.length < 2;
    onLine(s.line, s.err);
  }
  function stop() { clearInterval(timer); timer = null; el('play').textContent = '▶ Putar'; }
  function play() {
    if (steps.length < 2) return;
    if (idx === steps.length - 1) { idx = 0; draw(); }
    el('play').textContent = '⏸ Jeda';
    timer = setInterval(() => {
      if (idx < steps.length - 1) { idx++; draw(); }
      if (idx === steps.length - 1) stop();
    }, +el('speed').value);
  }
  const go = d => { stop(); idx = Math.max(0, Math.min(steps.length - 1, idx + d)); draw(); };
  const toggle = () => timer ? stop() : play();
  const reset = () => { stop(); idx = 0; draw(); };

  el('play').onclick = toggle;
  el('prev').onclick = () => go(-1);
  el('next').onclick = () => go(1);
  el('reset').onclick = reset;
  el('speed').onchange = () => { if (timer) { stop(); play(); } };

  return {
    load(s, autoplay) { stop(); steps = s; idx = 0; draw(); if (autoplay) play(); },
    stop, toggle, go, reset,
  };
}

function makeEditor(host, onRun) {
  if (window.CodeMirror) {
    const cm = CodeMirror(host, {
      mode: 'python', lineNumbers: true, indentUnit: 4, tabSize: 4, indentWithTabs: false, matchBrackets: true,
      extraKeys: {
        Tab: c => c.somethingSelected() ? c.indentSelection('add') : c.replaceSelection('    ', 'end'),
        'Shift-Tab': c => c.indentSelection('subtract'),
        'Ctrl-Enter': () => onRun(false), 'Cmd-Enter': () => onRun(false),
        'Shift-Ctrl-Enter': () => onRun(true), 'Shift-Cmd-Enter': () => onRun(true),
      },
    });
    let marked = [];
    return {
      get: () => cm.getValue(),
      set: v => cm.setValue(v),
      onChange: f => cm.on('change', f),
      refresh: () => setTimeout(() => cm.refresh(), 0),
      mark(line, cls) {
        marked.forEach(([l, c]) => cm.removeLineClass(l, 'background', c));
        marked = [];
        if (line && line <= cm.lineCount()) {
          cm.addLineClass(line - 1, 'background', cls);
          marked.push([line - 1, cls]);
          cm.scrollIntoView({ line: line - 1, ch: 0 }, 60);
        }
      },
    };
  }
  // Cadangan jika CodeMirror gagal dimuat
  const ta = document.createElement('textarea');
  ta.className = 'plain-editor'; ta.spellcheck = false;
  host.appendChild(ta);
  ta.addEventListener('keydown', e => {
    if (e.key === 'Tab') { e.preventDefault(); ta.setRangeText('    ', ta.selectionStart, ta.selectionEnd, 'end'); }
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); onRun(e.shiftKey); }
  });
  return { get: () => ta.value, set: v => ta.value = v, onChange: f => ta.addEventListener('input', f), refresh() {}, mark() {} };
}

const PY_HARNESS = String.raw`
import sys, ast, json, types, builtins, traceback
from js import prompt as _js_prompt

class _Stop(BaseException):
    pass

_TICK = '__bpv_tick__'

class _GuardInjector(ast.NodeTransformer):
    # Menyisipkan __bpv_tick__() di awal setiap badan perulangan dan blok except.
    # Begitu program dihentikan, tick terus melempar _Stop, sehingga "except:" milik
    # pengguna tidak bisa menelannya (melempar dari fungsi trace mematikan tracing).
    def _guard(self, body):
        call = ast.Expr(ast.Call(ast.Name(_TICK, ast.Load()), [], []))
        ast.copy_location(call, body[0])
        ast.fix_missing_locations(call)
        return [call] + body

    def visit_While(self, node):
        self.generic_visit(node)
        node.body = self._guard(node.body)
        return node

    visit_For = visit_AsyncFor = visit_While

    def visit_ExceptHandler(self, node):
        self.generic_visit(node)
        node.body = self._guard(node.body)
        return node

class _Out:
    def __init__(self, segs, kind):
        self.segs, self.kind = segs, kind
    def write(self, t):
        if t:
            self.segs.append([self.kind, t])
        return len(t)
    def flush(self):
        pass

def _short(r, n=40):
    return r if len(r) <= n else r[:n - 1] + '…'

def _ser(v):
    if isinstance(v, bool):
        return {'kind': 'bool', 'value': v}
    if isinstance(v, (int, float)):
        return {'kind': 'num', 'value': _short(repr(v), 20)}
    if isinstance(v, str):
        if 0 < len(v) <= 16 and '\n' not in v:
            return {'kind': 'str', 'value': v}
        return {'kind': 'box', 'value': _short(repr(v))}
    if isinstance(v, (list, tuple)) and 0 < len(v) <= 12 and all(
            isinstance(x, (int, float, str, bool)) and len(repr(x)) <= 10 for x in v):
        return {'kind': 'list', 'value': [repr(x) for x in v]}
    if isinstance(v, types.FunctionType):
        return {'kind': 'fn', 'value': 'def ' + v.__name__ + '()'}
    if isinstance(v, type):
        return {'kind': 'fn', 'value': 'class ' + v.__name__}
    return {'kind': 'box', 'value': _short(repr(v))}

def _vars(d):
    return [[k, _ser(v)] for k, v in list(d.items())
            if not k.startswith('__') and not isinstance(v, types.ModuleType)]

def _groups(frame):
    stack = []
    f = frame
    while f is not None and f.f_code.co_filename == '<user>':
        stack.append(f)
        f = f.f_back
    stack.reverse()
    groups = [{'name': 'global', 'vars': _vars(stack[0].f_globals)}] if stack else []
    for f in stack:
        name = f.f_code.co_name
        if not name.startswith('<'):
            groups.append({'name': name, 'vars': _vars(f.f_locals)})
    return groups

def _run(src, stdin, trace, interactive=True, max_steps=400, max_lines=200000):
    segs, steps = [], []
    lines_in = stdin.split('\n') if stdin else []
    state = {'count': 0, 'truncated': False, 'stopped': None}
    pending = {}
    ns = {'__name__': '__main__'}
    b = dict(builtins.__dict__)

    def stop(msg):
        state['stopped'] = msg
        raise _Stop(msg)

    def _tick():
        if state['stopped']:
            raise _Stop(state['stopped'])

    def _input(p=''):
        p = str(p)
        if p:
            segs.append(['p', p])
        if lines_in:
            v = lines_in.pop(0)
        elif interactive:
            r = _js_prompt(p or 'Masukkan input:')
            if r is None:
                stop('Input dibatalkan.')
            v = str(r)
        else:
            raise EOFError('input() dipanggil lebih banyak dari data input yang tersedia')
        segs.append(['i', v + '\n'])
        return v

    b['input'] = _input
    b[_TICK] = _tick
    ns['__builtins__'] = b

    def emit(line, frame):
        if len(steps) >= max_steps:
            state['truncated'] = True
            return
        steps.append({'line': line, 'groups': _groups(frame), 'segs': [list(s) for s in segs]})

    def tr(frame, event, arg):
        if frame.f_code.co_filename != '<user>':
            return None
        if event == 'line':
            state['count'] += 1
            if state['count'] > max_lines:
                stop('Program dihentikan: terlalu banyak langkah (kemungkinan perulangan tanpa akhir).')
            if trace:
                k = id(frame)
                if k in pending:
                    emit(pending[k], frame)
                pending[k] = frame.f_lineno
        elif event == 'exception' and trace:
            # Baris yang melempar error tidak selesai, jadi tidak dicatat sebagai langkah normal.
            pending.pop(id(frame), None)
        elif event == 'return' and trace:
            k = id(frame)
            if k in pending:
                emit(pending.pop(k), frame)
        return tr

    err = None
    old = sys.stdout, sys.stderr
    sys.stdout, sys.stderr = _Out(segs, 'o'), _Out(segs, 'e')
    try:
        tree = _GuardInjector().visit(ast.parse(src, '<user>'))
        code = compile(tree, '<user>', 'exec')
        sys.settrace(tr)
        try:
            exec(code, ns)
        finally:
            sys.settrace(None)
    except _Stop as e:
        err = {'type': 'Stop', 'msg': str(e), 'line': None}
    except SyntaxError as e:

    except BaseException as e:
        tb = [f for f in traceback.extract_tb(e.__traceback__) if f.filename == '<user>']
        err = {'type': type(e).__name__, 'msg': str(e), 'line': tb[-1].lineno if tb else None}
    finally:

    if state['stopped'] and (err is None or err['type'] != 'Stop'):
        err = {'type': 'Stop', 'msg': state['stopped'], 'line': None}
    if err:
        text = err['msg'] if err['type'] == 'Stop' else err['type'] + (': ' + err['msg'] if err['msg'] else '')
        if err['line']:
            text += '  (baris %d)' % err['line']
        segs.append(['e', text + '\n'])
    return json.dumps({'steps': steps, 'segs': segs, 'err': err,
                       'final': [{'name': 'global', 'vars': _vars(ns)}], 'truncated': state['truncated']})
`;

const PYODIDE_URL = 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/';
let pyPromise = null;
function setStatus(text, cls = '') { $('pyStatus').textContent = text; $('pyStatus').className = 'status ' + cls; }
function loadPy() {
  if (!pyPromise) {
    setStatus('⏳ Memuat Python… (pertama kali ±10 MB)');
    pyPromise = new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = PYODIDE_URL + 'pyodide.js';
      s.onload = res; s.onerror = () => rej(new Error('script'));
      document.head.appendChild(s);
    })
      .then(() => loadPyodide({ indexURL: PYODIDE_URL }))
      .then(py => { py.runPython(PY_HARNESS); setStatus('✔ Python siap', 'ok'); return py; })
      .catch(e => { pyPromise = null; setStatus('✘ Gagal memuat Python. Periksa koneksi internet lalu coba lagi.', 'bad'); throw e; });
  }
  return pyPromise;
}

async function pyRun(src, stdin, trace, interactive = true) {
  const py = await loadPy();
  const fn = py.globals.get('_run');
  try { return JSON.parse(fn(src, stdin, trace, interactive)); } finally { fn.destroy(); }
}

const fmtVal = v => v.kind === 'str' ? `"${v.value}"` : v.kind === 'list' ? `[${v.value.join(', ')}]` :
  v.kind === 'bool' ? (v.value ? 'True' : 'False') : v.value;

function toVars(groups, prev) {
  const vars = [], cur = {};
  groups.forEach(g => g.vars.forEach(([k, v]) => {
    const key = g.name + '.' + k, j = JSON.stringify(v);
    cur[key] = j;
    vars.push({ name: k, ...v, auto: true, group: g.name === 'global' ? null : g.name + '()', changed: prev !== null && prev[key] !== j });
  }));
  return { vars, cur };
}

function traceSteps(res, src) {
  const lines = src.split('\n');
  let prev = {}, prevOut = '';
  const steps = res.steps.map(s => {
    const { vars, cur } = toVars(s.groups, prev);
    const changes = vars.filter(v => v.changed && v.kind !== 'fn').map(v => `<b>${esc(v.name)}</b> = ${esc(fmtVal(v))}`);
    const out = outText(s.segs);
    const printed = out.length > prevOut.length ? out.slice(prevOut.length).trimEnd() : '';
    let note = `Baris ${s.line}: <code>${esc((lines[s.line - 1] || '').trim())}</code>`;
    if (changes.length) note += `<br>→ ${changes.join(', ')}`;
    if (printed) note += `<br>→ mencetak: <code>${esc(printed)}</code>`;
    prev = cur; prevOut = out;
    return { line: s.line, vars, segs: s.segs, note };
  });
  const last = steps[steps.length - 1];
  if (res.truncated) {
    // Langkah ke-400 bukan akhir program, jadi keadaan akhir ditampilkan sebagai langkah tersendiri.
    steps.push({ line: res.err ? res.err.line : 0, err: !!res.err, vars: toVars(res.final, null).vars, segs: res.segs,
      note: (res.err ? errNote(res.err) : '<b>✔ Program selesai.</b>') +
        '<br>Visualisasi hanya merekam 400 langkah pertama. Program tetap berjalan sampai akhir; yang tampil di sini adalah output dan variabel global terakhir.' });
  } else if (res.err) {
    steps.push({ line: res.err.line, err: true, vars: last ? last.vars.map(v => ({ ...v, changed: false })) : [], segs: res.segs, note: errNote(res.err) });
  } else if (last) {
    last.segs = res.segs;
    last.note += '<br><b>✔ Program selesai.</b>';
  } else {
    steps.push({ line: 0, vars: [], segs: res.segs, note: 'Tidak ada baris yang dijalankan.' });
  }
  return steps;
}

let running = false;
async function runCode(trace) {
  if (running) return;
  running = true;
  $('bRunCode').disabled = $('bTrace').disabled = true;
  EP.stop();
  try {
    await loadPy();
    setStatus('⏳ Menjalankan…');
    await new Promise(r => setTimeout(r, 30));
    const src = editor.get();
    const res = await pyRun(src, $('stdin').value, trace);
    if (trace) {
      EP.load(traceSteps(res, src), true);
    } else {
      const { vars } = toVars(res.final, null);
      EP.load([{ line: res.err ? res.err.line : 0, err: !!res.err, vars, segs: res.segs,
        note: res.err ? errNote(res.err) : '<b>✔ Program selesai.</b> Kotak di atas menunjukkan nilai akhir setiap variabel. Tekan <b>🔍 Langkah demi Langkah</b> untuk melihat prosesnya.' }]);
    }
    setStatus(res.err ? '✘ Ada error' : '✔ Selesai', res.err ? 'bad' : 'ok');
  } catch (e) {
    console.error(e);
  } finally {
    running = false;
    $('bRunCode').disabled = $('bTrace').disabled = false;
  }
}

$('bRunCode').onclick = () => runCode(false);
$('bTrace').onclick = () => runCode(true);

// ---------- Penilaian latihan ----------
const normOut = s => s.replace(/\r/g, '').split('\n').map(l => l.trimEnd()).join('\n').replace(/\n+$/, '');

$('bCheck').onclick = async () => {
  const t = editorCtx && editorCtx.task;
  if (!t || running) return;
  running = true;
  $('bCheck').disabled = true;
  $('taskFb').className = 'fb'; $('taskFb').textContent = '⏳ Memeriksa…';
  try {
    const src = editor.get();
    const rows = $('taskTests').children;
    let pass = 0;
    for (let i = 0; i < t.tests.length; i++) {
      const x = t.tests[i];
      const res = await pyRun(src, x.stdin, false, false);
      const got = normOut(outText(res.segs));
      const ok = !res.err && got === normOut(x.out);
      if (ok) pass++;
      rows[i].className = ok ? 'pass' : 'fail';
      rows[i].innerHTML = `${ok ? '✔' : '✘'} Input: <b>${x.stdin ? esc(x.stdin.replace(/\n/g, ' ⏎ ')) : '(tidak ada)'}</b> → harus <b>${esc(x.out.replace(/\n/g, ' ⏎ '))}</b>` +
        (ok ? '' : ` · hasilmu: <b>${res.err ? esc(res.err.type) : esc(got.replace(/\n/g, ' ⏎ ') || '(kosong)')}</b>`);
    }
    const all = pass === t.tests.length;
    $('taskFb').className = 'fb ' + (all ? 'ok' : 'no');
    $('taskFb').textContent = all ? '🎉 Semua tes lulus! Latihan selesai.' : `${pass} dari ${t.tests.length} tes lulus. Cek bagian yang ✘, lalu perbaiki kodemu. Ingat: cetak hasilnya saja, tanpa teks tambahan.`;
    if (all) { solvedTask.add(t.id); store.set('tasks', [...solvedTask]); renderNav(); }
  } catch (e) {
    $('taskFb').className = 'fb no'; $('taskFb').textContent = 'Python belum siap. Coba lagi sebentar.';
  } finally {
    running = false;
    $('bCheck').disabled = false;
  }
};
$('bHint').onclick = () => {
  const t = editorCtx.task;
  $('taskExtra').hidden = false; $('taskExtra').innerHTML = '💡 ' + esc(t.hint);
};
$('bSol').onclick = () => {
  const t = editorCtx.task;
  if (!confirm('Lihat solusi? Coba kerjakan sendiri dulu ya.')) return;
  $('taskExtra').hidden = false;
  $('taskExtra').innerHTML = `<b>Contoh solusi:</b>\n<code>${esc(t.sol)}</code>\n\n<button class="btn" id="bUseSol">Salin ke editor</button>`;
  $('bUseSol').onclick = () => editor.set(t.sol + '\n');
};

// ---------- Keyboard ----------
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, select, .CodeMirror')) return;
  const P = mode === 'materi' ? LP : EP;
  if (e.key === 'ArrowRight') P.go(1);
  else if (e.key === 'ArrowLeft') P.go(-1);
  else if (e.key === ' ') { e.preventDefault(); P.toggle(); }
  else if (e.key.toLowerCase() === 'r') P.reset();
});

setMode('materi');
</script>
