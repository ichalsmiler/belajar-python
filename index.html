<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Belajar Python Visual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05070a;
    --panel: #0b1a24;
    --panel-2: #0e2233;
    --border: #1f4a5c;
    --text: #d7e3ea;
    --muted: #7b93a3;
    --yellow: #f5d547;
    --green: #22c55e;
    --green-soft: #14532d;
    --red: #b91c1c;
    --red-soft: #4c1414;
    --cyan: #5eead4;
    --blue: #60a5fa;
    --kw: #c792ea;
    --str: #c3e88d;
    --num: #f78c6c;
    --fn: #82aaff;
    --line-hl: rgba(245, 213, 71, .14);
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--mono); font-size: 14px; line-height: 1.5; font-variant-ligatures: none;
  }
  button, input, select { font: inherit; }

  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid #12232e;
  }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; color: var(--yellow); font-size: 18px; }
  .logo svg { width: 26px; height: 26px; }
  header .tag { color: var(--muted); font-size: 12px; }

  .layout { display: grid; grid-template-columns: 240px 1fr; min-height: calc(100vh - 60px); }
  nav { border-right: 1px solid #12232e; padding: 16px 12px; }
  nav h3 { font-size: 11px; color: var(--muted); letter-spacing: .1em; margin: 0 8px 10px; }
  nav button {
    display: block; width: 100%; text-align: left; background: none; border: 1px solid transparent;
    color: var(--text); padding: 9px 10px; border-radius: 8px; cursor: pointer; margin-bottom: 4px;
  }
  nav button small { display: block; color: var(--muted); font-size: 11px; }
  nav button:hover { background: #0b151c; }
  nav button.active { background: var(--panel); border-color: var(--border); }
  nav button.active span { color: var(--yellow); }
  nav .done-mark { float: right; color: var(--green); }

  main { padding: 20px; max-width: 1200px; width: 100%; }
  .title { text-align: center; margin-bottom: 18px; }
  .title .py { color: var(--yellow); font-weight: 800; font-size: 13px; letter-spacing: .08em; }
  .title h1 { margin: 2px 0 0; font-size: 20px; color: var(--yellow); letter-spacing: .04em; }

  .grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 18px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

  /* Stage: kotak variabel */
  .stage {
    min-height: 170px; display: flex; flex-wrap: wrap; justify-content: center; align-content: flex-start;
    gap: 14px 16px; padding: 10px 6px 0;
  }
  .var { display: flex; flex-direction: column; align-items: center; animation: pop .25s ease; }
  .var .name { color: var(--cyan); font-size: 12px; margin-bottom: 4px; }
  .cells { position: relative; display: flex; border: 2px solid var(--cyan); border-radius: 6px; padding-bottom: 0; }
  .cell {
    width: var(--cw, 26px); height: 34px; display: grid; place-items: center;
    font-weight: 800; font-size: 16px; color: #fff; letter-spacing: 0; transition: background .2s;
  }
  .cells.str .cell { --cw: 26px; }
  .cells.list .cell { --cw: 42px; border-right: 1px solid #1f4a5c; }
  .cells.list .cell:last-child { border-right: none; }
  .cells.empty { min-width: 46px; height: 38px; display: grid; place-items: center; color: var(--muted); }
  .cell.hit { background: var(--green); color: #04130a; }
  .cell.miss { background: var(--red); }
  .cells.mark-miss { background: var(--red-soft); border-color: var(--red); }
  .cells.mark-miss .cell { color: #fca5a5; }
  .cells.mark-hit { background: var(--green-soft); border-color: var(--green); }
  .box {
    min-width: 46px; height: 38px; padding: 0 12px; display: grid; place-items: center;
    border: 2px solid var(--cyan); border-radius: 6px; font-weight: 800; font-size: 16px; color: #fff;
  }
  .box.bool-true { border-color: var(--green); color: var(--green); }
  .box.bool-false { border-color: var(--red); color: #fca5a5; }
  .changed .box, .changed .cells { animation: flash .6s ease; }
  .ptr-row { position: relative; height: 66px; width: 100%; }
  .ptr {
    position: absolute; top: 2px; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; transition: left .3s ease;
  }
  .ptr .arrow { color: var(--green); font-size: 16px; line-height: 1; font-weight: 800; }
  .ptr .pname { color: #fff; font-size: 11px; font-weight: 600; }
  .ptr .pval {
    min-width: 26px; height: 26px; padding: 0 5px; display: grid; place-items: center;
    border: 2px solid var(--cyan); border-radius: 5px; color: #fff; font-weight: 800; background: var(--bg);
  }
  .ptr.alt .arrow { color: var(--blue); }
  .ptr.alt .pval { border-color: var(--blue); }
  @keyframes pop { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
  @keyframes flash { 0% { box-shadow: 0 0 0 0 rgba(245,213,71,.9); } 100% { box-shadow: 0 0 0 10px rgba(245,213,71,0); } }

  /* Output */
  .label {
    display: inline-block; background: #1d2b12; color: var(--yellow); font-weight: 800;
    font-size: 11px; padding: 1px 6px; border-radius: 3px 3px 0 0; letter-spacing: .05em;
  }
  .output {
    background: var(--panel); border: 1px solid var(--border); border-radius: 0 6px 6px 6px;
    min-height: 92px; padding: 10px 14px; white-space: pre-wrap;
  }
  .output .in { color: var(--blue); }
  .output .enter {
    display: inline-block; margin-left: 10px; padding: 0 8px; border: 1px solid var(--green); border-radius: 4px;
    color: var(--green); font-size: 12px; line-height: 16px;
  }
  .cursor { display: inline-block; width: 8px; height: 15px; background: var(--text); vertical-align: -2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* Code */
  .editor { background: #0a2236; border: 1px solid #23506c; border-radius: 10px; overflow: hidden; }
  .dots { display: flex; gap: 7px; padding: 12px 14px; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .dots i:nth-child(1) { background: #ff5f57; } .dots i:nth-child(2) { background: #febc2e; } .dots i:nth-child(3) { background: #28c840; }
  .code { padding: 6px 0 14px; overflow-x: auto; }
  .ln { display: flex; padding: 1px 14px 1px 0; border-left: 3px solid transparent; white-space: pre; min-height: 22px; transition: background .2s; }
  .ln .no { width: 34px; text-align: right; padding-right: 12px; color: #5b7a8e; user-select: none; flex: none; }
  .ln.active { background: var(--line-hl); border-left-color: var(--yellow); }
  .ln.active .no { color: var(--yellow); }
  .tk-kw { color: var(--kw); } .tk-str { color: var(--str); } .tk-num { color: var(--num); }
  .tk-fn { color: var(--fn); } .tk-com { color: #5b7a8e; font-style: italic; }

  /* Controls */
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 12px; cursor: pointer;
  }
  .btn:hover { border-color: var(--cyan); }
  .btn.primary { background: var(--yellow); color: #1a1600; border-color: var(--yellow); font-weight: 800; }
  .btn:disabled { opacity: .4; cursor: default; }
  select.btn { padding: 7px 8px; }
  .progress { flex: 1 1 140px; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
  .bar { flex: 1; height: 6px; background: #12232e; border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--yellow); width: 0; transition: width .2s; }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .card h4 { margin: 0 0 6px; font-size: 12px; color: var(--yellow); letter-spacing: .06em; }
  .note { min-height: 44px; }
  .note b { color: var(--yellow); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { border: 1px solid var(--border); color: var(--cyan); border-radius: 999px; padding: 1px 9px; font-size: 12px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .field {
    flex: 1 1 160px; background: #061018; color: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px;
  }
  .field:focus { outline: none; border-color: var(--cyan); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .fb { margin-top: 8px; font-weight: 600; }
  .fb.ok { color: var(--green); } .fb.no { color: #f87171; }

  @media (max-width: 1150px) {
    .grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    nav { border-right: none; border-bottom: 1px solid #12232e; display: flex; overflow-x: auto; gap: 6px; padding: 10px 16px; }
    nav h3 { display: none; }
    nav button { flex: none; width: auto; margin: 0; }
    nav button small { display: none; }
    main { padding: 16px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <div class="logo">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path fill="#3776ab" d="M15.9 2c-7 0-6.6 3-6.6 3v3.2h6.7v1H6.6S2 8.6 2 15.7s4 6.8 4 6.8h2.4v-3.3s-.1-4 3.9-4h6.7s3.8.1 3.8-3.7V5.3S23.4 2 15.9 2zm-3.7 2.2a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4z"/><path fill="#ffd43b" d="M16.1 30c7 0 6.6-3 6.6-3v-3.2H16v-1h9.4s4.6.5 4.6-6.6-4-6.8-4-6.8h-2.4v3.3s.1 4-3.9 4H13s-3.8-.1-3.8 3.7v6.3S8.6 30 16.1 30zm3.7-2.2a1.2 1.2 0 1 1 0-2.4 1.2 1.2 0 0 1 0 2.4z"/></svg>
    PYTHON
  </div>
  <span class="tag">Belajar Python secara visual — lihat kode berjalan baris demi baris</span>
</header>

<div class="layout">
  <nav id="nav"><h3>MATERI</h3></nav>

  <main>
    <div class="title">
      <div class="py" id="lessonNo"></div>
      <h1 id="lessonTitle"></h1>
    </div>

    <div class="grid">
      <div class="col">
        <div class="stage" id="stage"></div>
        <div>
          <span class="label">OUTPUT</span>
          <div class="output" id="output"></div>
        </div>
        <div class="card note">
          <h4>PENJELASAN</h4>
          <div id="note"></div>
        </div>
      </div>

      <div class="col">
        <div class="editor">
          <div class="dots"><i></i><i></i><i></i></div>
          <div class="code" id="code"></div>
        </div>

        <div class="controls">
          <button class="btn" id="bReset" title="Ulang (R)">⏮</button>
          <button class="btn" id="bPrev" title="Mundur (←)">◀</button>
          <button class="btn primary" id="bPlay" title="Putar / jeda (Spasi)">▶ Putar</button>
          <button class="btn" id="bNext" title="Maju (→)">▶|</button>
          <select class="btn" id="speed" title="Kecepatan">
            <option value="1600">0.5×</option>
            <option value="900" selected>1×</option>
            <option value="450">2×</option>
          </select>
          <div class="progress"><div class="bar"><i id="barFill"></i></div><span id="stepInfo"></span></div>
        </div>

        <div class="card">
          <h4>COBA INPUT SENDIRI</h4>
          <div class="row">
            <input class="field" id="userInput" autocomplete="off">
            <button class="btn primary" id="bRun">Jalankan</button>
          </div>
          <div class="hint" id="inputHint"></div>
        </div>

        <div class="card">
          <h4>KONSEP</h4>
          <div id="concept"></div>
          <div class="chips" id="chips"></div>
        </div>

        <div class="card">
          <h4>TANTANGAN — TEBAK OUTPUT</h4>
          <div id="quizQ"></div>
          <div class="row" style="margin-top:8px">
            <input class="field" id="quizA" placeholder="Tulis output-nya…" autocomplete="off">
            <button class="btn" id="bQuiz">Cek</button>
          </div>
          <div class="fb" id="quizFb"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
// ---------- Tracer: merekam snapshot keadaan program per langkah ----------
function Tracer() {
  const vars = [], out = [], steps = [];
  const find = name => vars.find(v => v.name === name);
  return {
    steps,
    set(name, kind, value) {
      let v = find(name);
      if (!v) { v = { name }; vars.push(v); }
      Object.assign(v, { kind, value, changed: true });
    },
    mark(name, props) { Object.assign(find(name), props); },
    prompt(text) { out.push({ text, typing: true }); },
    typed(value) { const o = out[out.length - 1]; o.typing = false; o.input = value; o.enter = true; },
    print(text) { out.forEach(o => o.enter = false); out.push({ text }); },
    snap(line, note) {
      steps.push(JSON.parse(JSON.stringify({ line, note, vars, out })));
      vars.forEach(v => { delete v.changed; delete v.ptrs; delete v.hl; delete v.mark; });
    },
  };
}

const pyStr = s => `"${s}"`;

// ---------- Materi ----------
const LESSONS = [
  {
    title: 'COUNT VOWELS IN A WORD', menu: 'Hitung Huruf Vokal', sub: 'sum() + generator',
    input: 'ORANGE', hint: 'Masukkan sebuah kata, misalnya ORANGE atau Indonesia.',
    code: [
      'text = input("Enter text: ")',
      '',
      'vowels = "aeiou"',
      'count = sum(char.lower() in vowels for char in text)',
      '',
      'print("Vowels:", count)',
    ],
    concept: 'Ekspresi <b>char.lower() in vowels</b> menghasilkan True/False. Di Python True bernilai 1 dan False bernilai 0, jadi <b>sum()</b> dari semua hasil itu sama dengan jumlah huruf vokal.',
    chips: ['input()', 'str.lower()', 'operator in', 'generator expression', 'sum()'],
    quiz: { q: 'Jika pengguna mengetik <b>Python</b>, apa output-nya?', a: 'Vowels: 1' },
    trace(inp, T) {
      T.prompt('Enter text: ');
      T.snap(1, 'Fungsi <b>input()</b> menampilkan teks "Enter text: " dan menunggu pengguna mengetik.');
      T.typed(inp); T.set('text', 'str', inp);
      T.snap(1, `Pengguna mengetik <b>${inp}</b> lalu menekan Enter. Nilainya disimpan ke variabel <b>text</b>.`);
      T.set('vowels', 'str', 'aeiou');
      T.snap(3, 'Variabel <b>vowels</b> berisi semua huruf vokal sebagai acuan.');
      let count = 0;
      T.set('count', 'num', 0);
      T.snap(4, '<b>sum()</b> mulai dari 0. Generator akan memeriksa setiap <b>char</b> di dalam text satu per satu.');
      [...inp].forEach((c, i) => {
        const lc = c.toLowerCase(), k = 'aeiou'.indexOf(lc);
        T.mark('text', { ptrs: [{ i, name: 'char', val: c }] });
        if (k >= 0) {
          count++;
          T.mark('vowels', { hl: [{ i: k, st: 'hit' }], mark: 'hit' });
          T.set('count', 'num', count);
          T.snap(4, `char = "${c}" → "${lc}" <b>ada</b> di vowels ✔ → True (1). count menjadi <b>${count}</b>.`);
        } else {
          T.mark('vowels', { mark: 'miss' });
          T.snap(4, `char = "${c}" → "${lc}" <b>tidak ada</b> di vowels ✘ → False (0). count tetap <b>${count}</b>.`);
        }
      });
      T.print(`Vowels: ${count}`);
      T.snap(6, `<b>print()</b> menampilkan hasil akhir: ada <b>${count}</b> huruf vokal.`);
    },
  },
  {
    title: 'REVERSE A STRING', menu: 'Membalik Kata', sub: 'perulangan for',
    input: 'KASUR', hint: 'Masukkan kata yang ingin dibalik.',
    code: [
      'text = input("Enter text: ")',
      'result = ""',
      'for char in text:',
      '    result = char + result',
      'print("Reversed:", result)',
    ],
    concept: 'Setiap huruf diletakkan di <b>depan</b> hasil sebelumnya (<b>char + result</b>), sehingga huruf terakhir berakhir di posisi pertama.',
    chips: ['for … in', 'penggabungan string +', 'string kosong ""'],
    quiz: { q: 'Jika pengguna mengetik <b>KASUR</b>, apa output-nya?', a: 'Reversed: RUSAK' },
    trace(inp, T) {
      T.prompt('Enter text: ');
      T.snap(1, 'Program menunggu input dari pengguna.');
      T.typed(inp); T.set('text', 'str', inp);
      T.snap(1, `Input <b>${inp}</b> disimpan ke <b>text</b>.`);
      let result = '';
      T.set('result', 'str', '');
      T.snap(2, '<b>result</b> dimulai sebagai string kosong.');
      [...inp].forEach((c, i) => {
        T.mark('text', { ptrs: [{ i, name: 'char', val: c }] });
        T.snap(3, `Perulangan mengambil huruf ke-${i}: char = "${c}".`);
        result = c + result;
        T.mark('text', { ptrs: [{ i, name: 'char', val: c }] });
        T.set('result', 'str', result);
        T.mark('result', { hl: [{ i: 0, st: 'hit' }] });
        T.snap(4, `"${c}" ditaruh di depan → result = ${pyStr(result)}.`);
      });
      T.print(`Reversed: ${result}`);
      T.snap(5, `Hasil akhirnya <b>${result}</b>.`);
    },
  },
  {
    title: 'PALINDROME CHECK', menu: 'Cek Palindrom', sub: 'while + dua pointer',
    input: 'Level', hint: 'Masukkan kata, misalnya Level, katak, atau python.',
    code: [
      'word = input("Enter word: ").lower()',
      'left = 0',
      'right = len(word) - 1',
      'is_pal = True',
      'while left < right:',
      '    if word[left] != word[right]:',
      '        is_pal = False',
      '        break',
      '    left += 1',
      '    right -= 1',
      'print("Palindrome:", is_pal)',
    ],
    concept: 'Dua penunjuk (<b>left</b> dan <b>right</b>) bergerak dari ujung ke tengah. Jika ada pasangan huruf yang berbeda, kata itu bukan palindrom dan <b>break</b> menghentikan perulangan.',
    chips: ['while', 'indeks word[i]', 'len()', 'if / !=', 'break', 'bool'],
    quiz: { q: 'Jika pengguna mengetik <b>Level</b>, apa output-nya?', a: 'Palindrome: True' },
    trace(inp, T) {
      T.prompt('Enter word: ');
      T.snap(1, 'Program meminta sebuah kata.');
      const w = inp.toLowerCase();
      T.typed(inp); T.set('word', 'str', w);
      T.snap(1, `Input <b>${inp}</b> diubah ke huruf kecil dengan <b>.lower()</b> → ${pyStr(w)}.`);
      let left = 0, right = w.length - 1, isPal = true;
      const ptrs = () => T.mark('word', { ptrs: [{ i: left, name: 'left', val: left }, { i: right, name: 'right', val: right, alt: true }] });
      T.set('left', 'num', left); ptrs();
      T.snap(2, '<b>left</b> menunjuk huruf pertama (indeks 0).');
      T.set('right', 'num', right); ptrs();
      T.snap(3, `<b>right</b> menunjuk huruf terakhir: len(word) - 1 = ${right}.`);
      T.set('is_pal', 'bool', true); ptrs();
      T.snap(4, 'Kita anggap dulu kata ini palindrom (True).');
      while (true) {
        ptrs();
        if (!(left < right)) { T.snap(5, `${left} &lt; ${right} bernilai False → perulangan selesai.`); break; }
        T.snap(5, `${left} &lt; ${right} bernilai True → masuk ke perulangan.`);
        const same = w[left] === w[right];
        ptrs(); T.mark('word', { hl: [{ i: left, st: same ? 'hit' : 'miss' }, { i: right, st: same ? 'hit' : 'miss' }] });
        T.snap(6, `Bandingkan word[${left}] = "${w[left]}" dengan word[${right}] = "${w[right]}" → ${same ? '<b>sama</b> ✔' : '<b>berbeda</b> ✘'}.`);
        if (!same) {
          isPal = false; T.set('is_pal', 'bool', false); ptrs();
          T.snap(7, 'Karena berbeda, is_pal diubah menjadi False.');
          ptrs(); T.snap(8, '<b>break</b> langsung keluar dari perulangan while.');
          break;
        }
        left++; T.set('left', 'num', left); ptrs();
        T.snap(9, `left bergeser ke kanan → ${left}.`);
        right--; T.set('right', 'num', right); ptrs();
        T.snap(10, `right bergeser ke kiri → ${right}.`);
      }
      T.print(`Palindrome: ${isPal ? 'True' : 'False'}`);
      T.snap(11, isPal ? `"${w}" dibaca sama dari depan maupun belakang → <b>True</b>.` : `"${w}" bukan palindrom → <b>False</b>.`);
    },
  },
  {
    title: 'SUM OF NUMBERS', menu: 'Jumlah Angka', sub: 'list + split()',
    input: '4 5 6', hint: 'Masukkan beberapa bilangan bulat dipisah spasi, misalnya 4 5 6.',
    numeric: true,
    code: [
      'numbers = input("Enter numbers: ").split()',
      'total = 0',
      'for n in numbers:',
      '    total += int(n)',
      'print("Total:", total)',
    ],
    concept: '<b>split()</b> memecah teks berdasarkan spasi menjadi sebuah <b>list</b> string. Karena isinya masih teks, setiap elemen diubah ke angka dengan <b>int()</b> sebelum dijumlahkan.',
    chips: ['str.split()', 'list', 'for … in', 'int()', 'operator +='],
    quiz: { q: 'Jika pengguna mengetik <b>10 20 5</b>, apa output-nya?', a: 'Total: 35' },
    trace(inp, T) {
      const nums = inp.split(/\s+/).filter(Boolean);
      T.prompt('Enter numbers: ');
      T.snap(1, 'Program meminta deretan angka.');
      T.typed(inp); T.set('numbers', 'list', nums.map(pyStr));
      T.snap(1, `<b>split()</b> mengubah "${inp}" menjadi list [${nums.map(n => `'${n}'`).join(', ')}].`);
      let total = 0;
      T.set('total', 'num', 0);
      T.snap(2, '<b>total</b> dimulai dari 0.');
      nums.forEach((n, i) => {
        T.mark('numbers', { ptrs: [{ i, name: 'n', val: pyStr(n) }] });
        T.snap(3, `Ambil elemen ke-${i}: n = "${n}".`);
        total += parseInt(n, 10);
        T.mark('numbers', { ptrs: [{ i, name: 'n', val: pyStr(n) }], hl: [{ i, st: 'hit' }] });
        T.set('total', 'num', total);
        T.snap(4, `int("${n}") = ${n}, maka total = ${total - parseInt(n, 10)} + ${n} = <b>${total}</b>.`);
      });
      T.print(`Total: ${total}`);
      T.snap(5, `Jumlah seluruh angka adalah <b>${total}</b>.`);
    },
  },
  {
    title: 'FIND THE LARGEST', menu: 'Cari Nilai Terbesar', sub: 'list comprehension + if',
    input: '7 2 9 4', hint: 'Masukkan beberapa bilangan bulat dipisah spasi.',
    numeric: true,
    code: [
      'numbers = [int(x) for x in input("Enter numbers: ").split()]',
      'largest = numbers[0]',
      'for n in numbers:',
      '    if n > largest:',
      '        largest = n',
      'print("Largest:", largest)',
    ],
    concept: 'Simpan nilai pertama sebagai kandidat terbesar, lalu bandingkan dengan setiap elemen. Jika ditemukan yang lebih besar, kandidat diganti.',
    chips: ['list comprehension', 'indeks [0]', 'if / >', 'perbandingan'],
    quiz: { q: 'Jika pengguna mengetik <b>3 8 1 8 5</b>, apa output-nya?', a: 'Largest: 8' },
    trace(inp, T) {
      const nums = inp.split(/\s+/).filter(Boolean).map(n => parseInt(n, 10));
      T.prompt('Enter numbers: ');
      T.snap(1, 'Program meminta deretan angka.');
      T.typed(inp); T.set('numbers', 'list', nums.map(String));
      T.snap(1, `List comprehension mengubah setiap teks menjadi int → [${nums.join(', ')}].`);
      let largest = nums[0];
      T.set('largest', 'num', largest);
      T.mark('numbers', { hl: [{ i: 0, st: 'hit' }] });
      T.snap(2, `Kandidat awal: largest = numbers[0] = <b>${largest}</b>.`);
      nums.forEach((n, i) => {
        const bigger = n > largest;
        T.mark('numbers', { ptrs: [{ i, name: 'n', val: n }], hl: [{ i, st: bigger ? 'hit' : 'miss' }] });
        T.snap(3, `Ambil elemen ke-${i}: n = ${n}.`);
        T.mark('numbers', { ptrs: [{ i, name: 'n', val: n }], hl: [{ i, st: bigger ? 'hit' : 'miss' }] });
        T.snap(4, `${n} &gt; ${largest}? → <b>${bigger ? 'True' : 'False'}</b>.`);
        if (bigger) {
          largest = n;
          T.set('largest', 'num', largest);
          T.mark('numbers', { ptrs: [{ i, name: 'n', val: n }], hl: [{ i, st: 'hit' }] });
          T.snap(5, `Ganti kandidat: largest = <b>${largest}</b>.`);
        }
      });
      T.print(`Largest: ${largest}`);
      T.snap(6, `Nilai terbesar adalah <b>${largest}</b>.`);
    },
  },
  {
    title: 'FACTORIAL', menu: 'Faktorial', sub: 'range() + *=',
    input: '5', hint: 'Masukkan bilangan bulat 0 sampai 12.',
    numeric: true, single: true,
    code: [
      'n = int(input("Enter n: "))',
      'result = 1',
      'for i in range(1, n + 1):',
      '    result *= i',
      'print(f"{n}! =", result)',
    ],
    concept: 'Faktorial n! adalah hasil kali 1 × 2 × … × n. <b>range(1, n + 1)</b> menghasilkan angka 1 sampai n (batas akhir tidak ikut), dan <b>result *= i</b> mengalikan satu per satu.',
    chips: ['int()', 'range()', 'operator *=', 'f-string'],
    quiz: { q: 'Jika pengguna mengetik <b>4</b>, apa output-nya?', a: '4! = 24' },
    trace(inp, T) {
      const n = Math.max(0, Math.min(12, parseInt(inp, 10) || 0));
      T.prompt('Enter n: ');
      T.snap(1, 'Program meminta nilai n.');
      T.typed(String(n)); T.set('n', 'num', n);
      T.snap(1, `int() mengubah input menjadi angka: n = <b>${n}</b>.`);
      let result = 1;
      T.set('result', 'num', 1);
      T.snap(2, '<b>result</b> dimulai dari 1 (bukan 0, karena kita mengalikan).');
      const rng = Array.from({ length: n }, (_, k) => String(k + 1));
      T.set(`range(1, ${n + 1})`, 'list', rng);
      T.snap(3, n ? `range(1, ${n + 1}) menghasilkan ${rng.join(', ')}.` : 'range(1, 1) kosong, jadi perulangan tidak dijalankan.');
      rng.forEach((v, k) => {
        const i = k + 1;
        T.set('i', 'num', i);
        T.mark(`range(1, ${n + 1})`, { ptrs: [{ i: k, name: 'i', val: i }] });
        T.snap(3, `i = ${i}.`);
        const before = result;
        result *= i;
        T.set('result', 'num', result);
        T.mark(`range(1, ${n + 1})`, { ptrs: [{ i: k, name: 'i', val: i }], hl: [{ i: k, st: 'hit' }] });
        T.snap(4, `result = ${before} × ${i} = <b>${result}</b>.`);
      });
      T.print(`${n}! = ${result}`);
      T.snap(5, `f-string menyisipkan nilai n ke dalam teks → <b>${n}! = ${result}</b>.`);
    },
  },
];

// ---------- Tampilan ----------
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const TOKEN = /(#.*$)|(f?"[^"]*"|'[^']*')|\b(for|in|if|elif|else|while|break|return|def|True|False|None|and|or|not)\b|\b(print|input|sum|len|int|range|str|list)\b|\b(\d+)\b/g;
const highlight = line => esc(line).replace(TOKEN, (m, com, str, kw, fn, num) =>
  com ? `<span class="tk-com">${m}</span>` : str ? `<span class="tk-str">${m}</span>` :
  kw ? `<span class="tk-kw">${m}</span>` : fn ? `<span class="tk-fn">${m}</span>` : `<span class="tk-num">${m}</span>`);

let lesson, steps = [], idx = 0, timer = null;
const solved = new Set();

function renderNav() {
  $('nav').innerHTML = '<h3>MATERI</h3>' + LESSONS.map((l, i) =>
    `<button data-i="${i}" class="${l === lesson ? 'active' : ''}"><span>${i + 1}. ${l.menu}</span>${solved.has(i) ? '<b class="done-mark">✔</b>' : ''}<small>${l.sub}</small></button>`).join('');
}

function renderVar(v) {
  const wrap = document.createElement('div');
  wrap.className = 'var' + (v.changed ? ' changed' : '');
  let body;
  if (v.kind === 'str' || v.kind === 'list') {
    const items = v.kind === 'str' ? [...v.value] : v.value;
    if (!items.length) body = `<div class="cells empty">${v.kind === 'str' ? '""' : '[ ]'}</div>`;
    else {
      const hl = {}; (v.hl || []).forEach(h => hl[h.i] = h.st);
      const cw = v.kind === 'str' ? 26 : 42;
      const cells = items.map((c, i) => `<div class="cell ${hl[i] || ''}">${esc(c)}</div>`).join('');
      const ptrs = (v.ptrs || []).map(p =>
        `<div class="ptr ${p.alt ? 'alt' : ''}" style="left:${p.i * cw + cw / 2}px"><span class="arrow">↑</span><span class="pname">${esc(p.name)}</span><span class="pval">${esc(p.val)}</span></div>`).join('');
      body = `<div class="cells ${v.kind} ${v.mark ? 'mark-' + v.mark : ''}">${cells}</div>` +
        (v.ptrs ? `<div class="ptr-row" style="width:${items.length * cw}px">${ptrs}</div>` : '');
    }
  } else if (v.kind === 'bool') {
    body = `<div class="box bool-${v.value}">${v.value ? 'True' : 'False'}</div>`;
  } else {
    body = `<div class="box">${esc(v.value)}</div>`;
  }
  wrap.innerHTML = `<div class="name">${esc(v.name)}</div>${body}`;
  return wrap;
}

function render() {
  const s = steps[idx];
  const stage = $('stage'); stage.innerHTML = '';
  s.vars.forEach(v => stage.appendChild(renderVar(v)));

  $('output').innerHTML = s.out.map(o =>
    esc(o.text) + (o.input !== undefined ? `<span class="in">${esc(o.input)}</span>` : '') +
    (o.enter ? '<span class="enter">↵</span>' : '') + (o.typing ? '<span class="cursor"></span>' : '')).join('\n');

  $('code').querySelectorAll('.ln').forEach((el, i) => el.classList.toggle('active', i + 1 === s.line));
  $('note').innerHTML = s.note;
  $('stepInfo').textContent = `${idx + 1}/${steps.length}`;
  $('barFill').style.width = `${(idx + 1) / steps.length * 100}%`;
  $('bPrev').disabled = idx === 0;
  $('bNext').disabled = idx === steps.length - 1;
}

function build(inp) {
  const T = Tracer();
  lesson.trace(inp, T);
  steps = T.steps; idx = 0;
  render();
}

function openLesson(i) {
  stop();
  lesson = LESSONS[i];
  renderNav();
  $('lessonNo').textContent = `MATERI ${i + 1}`;
  $('lessonTitle').textContent = lesson.title;
  $('code').innerHTML = lesson.code.map((l, n) => `<div class="ln"><span class="no">${n + 1}</span><span>${highlight(l)}</span></div>`).join('');
  $('userInput').value = lesson.input;
  $('inputHint').textContent = lesson.hint;
  $('concept').innerHTML = lesson.concept;
  $('chips').innerHTML = lesson.chips.map(c => `<span class="chip">${esc(c)}</span>`).join('');
  $('quizQ').innerHTML = lesson.quiz.q;
  $('quizA').value = ''; $('quizFb').textContent = ''; $('quizFb').className = 'fb';
  build(lesson.input);
}

function validInput(v) {
  v = v.trim();
  if (!v) return 'Input tidak boleh kosong.';
  if (lesson.single && !/^\d+$/.test(v)) return 'Masukkan satu bilangan bulat, misalnya 5.';
  if (lesson.single && +v > 12) return 'Gunakan n maksimal 12 agar hasilnya tidak terlalu besar.';
  if (lesson.numeric && !/^-?\d+(\s+-?\d+)*$/.test(v)) return 'Masukkan bilangan bulat dipisah spasi, misalnya 4 5 6.';
  if (lesson.numeric && v.split(/\s+/).length > 10) return 'Maksimal 10 angka.';
  if (!lesson.numeric && v.length > 14) return 'Maksimal 14 karakter supaya visualisasi tetap muat.';
  return '';
}

// ---------- Kontrol ----------
function stop() { clearInterval(timer); timer = null; $('bPlay').textContent = '▶ Putar'; }
function play() {
  if (idx === steps.length - 1) { idx = 0; render(); }
  $('bPlay').textContent = '⏸ Jeda';
  timer = setInterval(() => {
    if (idx < steps.length - 1) { idx++; render(); }
    if (idx === steps.length - 1) stop();
  }, +$('speed').value);
}
const go = d => { stop(); idx = Math.max(0, Math.min(steps.length - 1, idx + d)); render(); };

$('nav').addEventListener('click', e => { const b = e.target.closest('button'); if (b) openLesson(+b.dataset.i); });
$('bPlay').onclick = () => timer ? stop() : play();
$('bPrev').onclick = () => go(-1);
$('bNext').onclick = () => go(1);
$('bReset').onclick = () => { stop(); idx = 0; render(); };
$('speed').onchange = () => { if (timer) { stop(); play(); } };
$('bRun').onclick = () => {
  const err = validInput($('userInput').value);
  $('inputHint').textContent = err || lesson.hint;
  $('inputHint').style.color = err ? '#f87171' : '';
  if (err) return;
  stop(); build($('userInput').value.trim()); play();
};
$('userInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('bRun').click(); });

const norm = s => s.trim().toLowerCase().replace(/\s+/g, ' ');
$('bQuiz').onclick = () => {
  const got = norm($('quizA').value), want = norm(lesson.quiz.a);
  const value = want.split(/[:=]\s*/).pop();
  const ok = got === want || got === value;
  $('quizFb').className = 'fb ' + (ok ? 'ok' : 'no');
  $('quizFb').textContent = ok ? `Benar! Output: ${lesson.quiz.a}` : 'Belum tepat. Coba jalankan dengan input tersebut lalu perhatikan langkahnya.';
  if (ok) { solved.add(LESSONS.indexOf(lesson)); renderNav(); }
};
$('quizA').addEventListener('keydown', e => { if (e.key === 'Enter') $('bQuiz').click(); });

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowRight') go(1);
  else if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === ' ') { e.preventDefault(); timer ? stop() : play(); }
  else if (e.key.toLowerCase() === 'r') $('bReset').click();
});

openLesson(0);
</script>
</body>
</html>
